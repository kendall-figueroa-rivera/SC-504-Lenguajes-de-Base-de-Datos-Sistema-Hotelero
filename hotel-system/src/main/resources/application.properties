# =============================================
# CONFIGURACION DEL SERVIDOR
# =============================================
server.port=8080
spring.application.name=hotel-sistema
# =============================================
# CONEXION A ORACLE CLOUD ATP - WALLET
# Usuario: ADMIN
# Service: proyectolenguajes_high
# Wallet: C:\lenguajes\Wallet_ProyectoLenguajes.zip
# =============================================
spring.datasource.url=jdbc:oracle:thin:@proyectolenguajes_high?TNS_ADMIN=C:/Lenguajes/Wallet_ProyectoLenguajes
spring.datasource.username=ADMIN
spring.datasource.password=Timpy#191021
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
# =============================================
# SEGURIDAD
# =============================================
spring.security.user.name=admin_default
spring.security.user.password=disabled_use_db
# =============================================
# LOGGING
# =============================================
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG