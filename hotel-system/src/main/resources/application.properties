app properties que sirve 

# =============================================
# CONFIGURACION DEL SERVIDOR
# =============================================
server.port=8080
spring.application.name=hotel-sistema

# =============================================
# CONEXION A SQL SERVER
# Servidor: KENDALL\SQLEXPRESS
# Base de datos: hotelLenguaje
# Usuario: hotel_app
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=hotelLenguaje;trustServerCertificate=true;encrypt=false
spring.datasource.username=hotel_app
spring.datasource.password=Hotellenguaje2024!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# =============================================
# SEGURIDAD
# =============================================
spring.security.user.name=admin_default
spring.security.user.password=disabled_use_db

# =============================================
# LOGGING
# =============================================
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=DEBUG
