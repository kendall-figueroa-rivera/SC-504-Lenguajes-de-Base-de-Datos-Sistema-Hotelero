<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/><title>Detalle Reservación | Hotel Lenguaje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('reservaciones')}"></div>
    <div class="main-content">
        <header class="topbar">
            <h1 class="page-title">Detalle de Reservación</h1>
        </header>
        <main class="page-body">

            <div th:if="${reservacion == null}">
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i> Reservación no encontrada.
                </div>
                <a th:href="@{/reservaciones}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Volver</a>
            </div>

            <div th:if="${reservacion != null}">

                <!-- INFO PRINCIPAL -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">

                    <!-- Datos reservación -->
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">Reservación #<span th:text="${reservacion.idReservacion}"></span></span>
                            <span th:class="'badge badge-' + (${reservacion.estado=='confirmada'}?'success':(${reservacion.estado=='cancelada'}?'danger':'warning'))"
                                  th:text="${reservacion.estado}"></span>
                        </div>
                        <div class="card-body">
                            <table style="width:100%; border-collapse:collapse;">
                                <tr style="border-bottom:1px solid var(--border);">
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; width:45%;">Huésped</td>
                                    <td style="padding:10px 0; color:var(--text-primary);"
                                        th:text="${reservacion.usuario.nombre + ' ' + reservacion.usuario.apellido1}"></td>
                                </tr>
                                <tr style="border-bottom:1px solid var(--border);">
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Identificación</td>
                                    <td style="padding:10px 0; color:var(--text-primary);" th:text="${reservacion.usuario.identificacion}"></td>
                                </tr>
                                <tr style="border-bottom:1px solid var(--border);">
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Entrada</td>
                                    <td style="padding:10px 0; color:var(--text-primary);" th:text="${reservacion.fechaEntrada}"></td>
                                </tr>
                                <tr style="border-bottom:1px solid var(--border);">
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Salida</td>
                                    <td style="padding:10px 0; color:var(--text-primary);" th:text="${reservacion.fechaSalida}"></td>
                                </tr>
                                <tr style="border-bottom:1px solid var(--border);">
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Noches</td>
                                    <td style="padding:10px 0; color:var(--text-primary);" th:text="${#temporals.days(reservacion.fechaEntrada, reservacion.fechaSalida)}"></td>
                                </tr>
                                <tr>
                                    <td style="padding:10px 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Total</td>
                                    <td style="padding:10px 0; color:var(--gold); font-size:18px; font-family:var(--font-display);"
                                        th:text="'₡ ' + ${#numbers.formatDecimal(reservacion.totalPago, 1, 2)}"></td>
                                </tr>
                            </table>
                        </div>
                    </div>

                    <!-- Datos habitación -->
                    <div class="card">
                        <div class="card-header"><span class="card-title">Habitación</span></div>
                        <div class="card-body">
                            <div style="text-align:center; padding:16px 0;">
                                <div style="font-size:48px; color:var(--gold); margin-bottom:12px;">
                                    <i class="fas fa-bed"></i>
                                </div>
                                <div style="font-family:var(--font-display); font-size:32px; color:var(--text-primary);"
                                     th:text="'#' + ${reservacion.habitacion.numero}"></div>
                                <div style="color:var(--text-muted); margin-top:4px; text-transform:capitalize;"
                                     th:text="${reservacion.habitacion.tipo}"></div>
                                <div style="color:var(--gold); margin-top:12px; font-size:18px;"
                                     th:text="'₡ ' + ${#numbers.formatDecimal(reservacion.habitacion.precioNoche,1,2)} + ' / noche'"></div>
                            </div>
                            <div th:if="${reservacion.oferta != null}"
                                 style="background:var(--gold-glow); border:1px solid var(--gold-dim); border-radius:8px; padding:12px; text-align:center; margin-top:12px;">
                                <i class="fas fa-tag" style="color:var(--gold);"></i>
                                <span style="color:var(--gold); margin-left:6px;" th:text="${reservacion.oferta.titulo}"></span>
                                <span style="color:var(--text-secondary); margin-left:4px;"
                                      th:text="'— ' + ${reservacion.oferta.descuento} + '% de descuento'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ACCIONES -->
                <div class="card">
                    <div class="card-header"><span class="card-title">Acciones</span></div>
                    <div class="card-body">
                        <div style="display:flex; gap:12px; flex-wrap:wrap;">
                            <a th:href="@{/pagos/nuevo}" class="btn btn-primary"
                               th:if="${reservacion.estado == 'confirmada'}">
                                <i class="fas fa-credit-card"></i> Procesar Pago
                            </a>
                            <a th:href="@{/pagos/cancelar/{id}(id=${reservacion.idReservacion})}"
                               class="btn btn-danger"
                               th:if="${reservacion.estado == 'confirmada'}"
                               onclick="return confirm('¿Cancelar esta reservación?')">
                                <i class="fas fa-times"></i> Cancelar Reservación
                            </a>
                            <a th:href="@{/reservaciones}" class="btn btn-outline">
                                <i class="fas fa-arrow-left"></i> Volver al listado
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
