<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/><title>Editar Usuario | Hotel Lenguaje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments :: sidebar('usuarios')}"></div>
    <div class="main-content">
        <header class="topbar"><h1 class="page-title">Editar Usuario</h1></header>
        <main class="page-body">
            <div class="card" style="max-width:580px;">
                <div class="card-header"><span class="card-title">Datos del Usuario</span></div>
                <div class="card-body">
                    <form th:action="@{/usuarios/guardar}" method="post" th:object="${usuario}">
                        <input type="hidden" th:field="*{idUsuario}"/>
                        <input type="hidden" th:field="*{contrasena}"/>
                        <input type="hidden" th:field="*{fechaRegistro}"/>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Primer Apellido</label>
                                <input type="text" th:field="*{apellido1}" class="form-control" required/>
                            </div>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Segundo Apellido</label>
                                <input type="text" th:field="*{apellido2}" class="form-control"/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control"/>
                            </div>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Correo</label>
                                <input type="email" th:field="*{correo}" class="form-control" required/>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Rol</label>
                                <select name="idRol" class="form-control">
                                    <option value="">Sin rol</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.idRol}"
                                            th:text="${r.nombre}"
                                            th:selected="${usuario.rol != null and usuario.rol.idRol == r.idRol}"></option>
                                </select>
                            </div>
                        </div>
                        <div style="display:flex;gap:12px;margin-top:8px;">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                            <a th:href="@{/usuarios}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
