<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Reservaciones | Hotel Lenguaje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-layout">
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">⬡</span>
            <div class="brand-text"><span class="brand-name">Hotel</span><span class="brand-sub">Lenguaje</span></div>
        </div>
        <ul class="nav-list">
            <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
            <li class="nav-section">GESTIÓN</li>
            <li class="nav-item"><a th:href="@{/reservaciones}" class="nav-link active"><i class="fas fa-calendar-check"></i><span>Reservaciones</span></a></li>
            <li class="nav-item"><a th:href="@{/habitaciones}" class="nav-link"><i class="fas fa-bed"></i><span>Habitaciones</span></a></li>
            <li class="nav-item"><a th:href="@{/pagos}" class="nav-link"><i class="fas fa-credit-card"></i><span>Pagos</span></a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a th:href="@{/usuarios}" class="nav-link"><i class="fas fa-users"></i><span>Usuarios</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-details">
                    <span class="user-name" sec:authentication="name">Usuario</span>
                </div>
            </div>
            <a th:href="@{/logout}" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <h1 class="page-title">Reservaciones</h1>
        </header>

        <main class="page-body">
            <div th:if="${exito}" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${exito}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Todas las Reservaciones</span>
                    <a th:href="@{/reservaciones/nueva}" class="btn btn-primary btn-sm">
                        <i class="fas fa-plus"></i> Nueva
                    </a>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Huésped</th>
                            <th>Habitación</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="res : ${reservaciones}">
                            <td th:text="${res.idReservacion}"></td>
                            <td th:text="${res.usuario.nombre + ' ' + res.usuario.apellido1}"></td>
                            <td th:text="'#' + ${res.habitacion.numero} + ' — ' + ${res.habitacion.tipo}"></td>
                            <td th:text="${res.fechaEntrada}"></td>
                            <td th:text="${res.fechaSalida}"></td>
                            <td th:text="'₡ ' + ${#numbers.formatDecimal(res.totalPago, 1, 2)}"></td>
                            <td>
                                <span th:class="'badge badge-' +
                                    (${res.estado == 'confirmada'} ? 'success' :
                                    (${res.estado == 'cancelada'} ? 'danger' :
                                    (${res.estado == 'pendiente'} ? 'warning' : 'info')))"
                                      th:text="${res.estado}"></span>
                            </td>
                            <td>
                                <a th:href="@{/reservaciones/detalle/{id}(id=${res.idReservacion})}"
                                   class="btn btn-outline btn-sm">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/reservaciones/cancelar/{id}(id=${res.idReservacion})}"
                                   class="btn btn-danger btn-sm"
                                   th:if="${res.estado != 'cancelada'}"
                                   onclick="return confirm('¿Cancelar esta reservación?')">
                                    <i class="fas fa-times"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservaciones)}">
                            <td colspan="8" style="text-align:center; color:var(--text-muted); padding:32px;">
                                No hay reservaciones registradas.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
